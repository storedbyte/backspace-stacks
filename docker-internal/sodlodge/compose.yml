services:
  app:
    build: .
    image: ledger-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/ledger.db
    volumes:
      - ledger-data:/data # the database lives here; back this up
    ports:
      - "${APP_PORT:-3090}:3090"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ledger-data:
