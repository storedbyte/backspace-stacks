services:
  couchdb:
    image: couchdb:3
    container_name: couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - /mnt/data/couchdb:/opt/couchdb/data
      - ./10-livesync.ini:/opt/couchdb/etc/local.d/10-livesync.ini
    ports:
      - "5984:5984"
